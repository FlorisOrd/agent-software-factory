name: Check delivery workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-workflow:
    name: Static configuration and discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the checked revision
        run: |
          printf 'Event revision: %s\nRef: %s\n' "$GITHUB_SHA" "$GITHUB_REF"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Check the installation
        run: |
          node --check scripts/check-workflow.mjs
          node scripts/check-workflow.mjs
